version: '3.9'

services:
  # =============================================================================
  # API Backend
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: omics-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://omics:omics_secret@postgres:5432/omics_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_secret
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - DEBUG=true
      # Optional: data collector API keys (see docs/CONFIGURATION.md)
      - COSMIC_API_KEY=${COSMIC_API_KEY:-}
      - COSMIC_EMAIL=${COSMIC_EMAIL:-}
      - ONCOKB_API_TOKEN=${ONCOKB_API_TOKEN:-}
      - DRUGBANK_API_KEY=${DRUGBANK_API_KEY:-}
      - DEPMAP_API_KEY=${DEPMAP_API_KEY:-}
      - UPLOAD_DIR=/app/data/uploads
      - DATA_DIR=/app/data
      - RESULTS_DIR=/app/results
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - omics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Celery Worker
  # =============================================================================
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: omics-celery-worker
    command: celery -A backend.app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://omics:omics_secret@postgres:5432/omics_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - COSMIC_API_KEY=${COSMIC_API_KEY:-}
      - COSMIC_EMAIL=${COSMIC_EMAIL:-}
      - ONCOKB_API_TOKEN=${ONCOKB_API_TOKEN:-}
      - DRUGBANK_API_KEY=${DRUGBANK_API_KEY:-}
      - DEPMAP_API_KEY=${DEPMAP_API_KEY:-}
      - UPLOAD_DIR=/app/data/uploads
      - DATA_DIR=/app/data
      - RESULTS_DIR=/app/results
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - api
      - redis
    networks:
      - omics-network

  # =============================================================================
  # Celery Beat (Scheduler)
  # =============================================================================
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: omics-celery-beat
    command: celery -A backend.app.core.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app/backend
    depends_on:
      - celery-worker
    networks:
      - omics-network

  # =============================================================================
  # Flower (Celery Monitoring)
  # =============================================================================
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: omics-flower
    command: celery -A backend.app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - celery-worker
    networks:
      - omics-network

  # =============================================================================
  # Dash Dashboards
  # =============================================================================
  dashboards:
    build:
      context: .
      dockerfile: docker/Dockerfile.dash
    container_name: omics-dashboards
    ports:
      - "8050:8050"
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./dashboards:/app/dashboards
    depends_on:
      - api
    networks:
      - omics-network

  # =============================================================================
  # React Frontend
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omics-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
      - REACT_APP_GRAPHQL_URL=http://localhost:8000/graphql
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api
    networks:
      - omics-network

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omics-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=omics
      - POSTGRES_PASSWORD=omics_secret
      - POSTGRES_DB=omics_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - omics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omics -d omics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: omics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - omics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Neo4j Graph Database
  # =============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: omics-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4j_secret
      - NEO4J_PLUGINS=apoc,graph-data-science
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - omics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # Apache Kafka
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omics-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - omics-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omics-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - omics-network

  # =============================================================================
  # MinIO (S3-compatible storage)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: omics-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - omics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =============================================================================
  # Prometheus (Metrics)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: omics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - omics-network

  # =============================================================================
  # Grafana (Visualization)
  # =============================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: omics-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - omics-network

  # =============================================================================
  # JupyterLab
  # =============================================================================
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: omics-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=omics_jupyter_token
      - API_URL=http://api:8000
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
      - ./results:/home/jovyan/results
    depends_on:
      - api
    networks:
      - omics-network

networks:
  omics-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  zookeeper_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
