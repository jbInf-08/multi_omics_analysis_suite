[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-omics-analysis-suite"
version = "1.0.0"
description = "Comprehensive multi-omics analysis platform covering 50+ omics disciplines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Multi-Omics Team"}
]
keywords = [
    "bioinformatics", "omics", "genomics", "proteomics", "transcriptomics",
    "metabolomics", "multi-omics", "machine-learning", "deep-learning",
    "genome-assembly", "annotation", "alignment", "computational-chemistry",
    "systems-biology", "long-reads", "single-cell", "epigenetics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "neo4j>=5.15.0",
    
    # Task Queue
    "celery>=5.3.0",
    "flower>=2.0.0",
    
    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    
    # ML/AI
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.2.0",
    "catboost>=1.2.0",
    "shap>=0.44.0",
    "lime>=0.2.0",
    "optuna>=3.5.0",
    
    # Bioinformatics Core
    "biopython>=1.82",
    "pydeseq2>=0.4.0",
    "scanpy>=1.9.0",
    "anndata>=0.10.0",
    "pysam>=0.22.0",
    
    # Genome Assembly & Alignment
    "minimap2>=2.26",
    "mappy>=2.26",
    
    # Long Read Analysis
    "pod5>=0.3.0",
    "pyfastx>=2.0.0",
    
    # Single Cell
    "scvi-tools>=1.0.0",
    "muon>=0.1.5",
    "squidpy>=1.3.0",
    "scvelo>=0.3.0",
    
    # Epigenetics
    "pyranges>=0.0.129",
    "pybedtools>=0.9.0",
    "deeptools>=3.5.0",
    
    # Systems Biology
    "cobra>=0.29.0",
    "tellurium>=2.2.0",
    
    # Computational Chemistry
    "rdkit>=2023.9.0",
    "mdanalysis>=2.6.0",
    "openbabel>=3.1.0",
    
    # Structure Biology
    "biotite>=0.39.0",
    "prody>=2.4.0",
    
    # Survival Analysis
    "lifelines>=0.27.8",
    
    # Pathway Analysis
    "gseapy>=1.0.0",
    
    # R Integration
    "rpy2>=3.5.12",
    
    # Visualization
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "networkx>=3.2.0",
    
    # API & Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",
    "aiohttp>=3.9.0",
    
    # GraphQL
    "strawberry-graphql>=0.217.0",
    
    # Streaming / Real-time
    "aiokafka>=0.10.0",
    "kafka-python>=2.0.2",
    "confluent-kafka>=2.3.0",
    
    # CLI
    "typer>=0.9.0",
    "rich>=13.7.0",
    
    # Report Generation
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    
    # LLM/AI Integration
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    
    # Workflow Orchestration
    "snakemake>=7.32.0",
    
    # Galaxy Integration
    "bioblend>=1.2.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-redis>=4.6.0",
    "types-PyYAML>=6.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "papermill>=2.5.0",
    "nbformat>=5.9.0",
]
dash = [
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "dash-cytoscape>=0.3.0",
]

[project.scripts]
omics = "cli.main:app"
moas = "cli.main:app"

[project.urls]
Homepage = "https://github.com/jbInf-08/multi_omics_analysis_suite"
Documentation = "https://multi-omics.readthedocs.io"
Repository = "https://github.com/jbInf-08/multi_omics_analysis_suite"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "cli*", "dashboards*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D107", "D203", "D213"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "backend.app.api.graphql.schema"
disable_error_code = ["call-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "backend.app.api.graphql.context"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=backend --cov-report=term-missing"
