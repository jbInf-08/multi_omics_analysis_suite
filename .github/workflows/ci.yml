name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings
          pip install ruff mypy black

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with MyPy
        run: |
          pip install types-redis types-PyYAML
          mypy backend/app/api/v1/routes/omics.py \
            backend/app/api/graphql/schema.py \
            backend/app/api/graphql/context.py \
            backend/app/core/analysis_progress_bus.py \
            --ignore-missing-imports \
            --explicit-package-bases \
            --follow-imports=silent \
            --no-error-summary

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_omics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      # rpy2 (a project dependency) refuses to build in API mode without R on
      # PATH/R_HOME, and its rinterface link step needs libtirpc.
      - name: Install system dependencies (R for rpy2)
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev libtirpc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=backend --cov-report=xml --cov-report=term-missing -x
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run bioinformatics tools API tests
        run: |
          pytest tests/integration/test_bioinformatics_tools_api.py \
            tests/integration/test_omics_analyze_api.py -v --no-cov
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run integration tests
        run: |
          pytest tests/integration -v --cov=backend --cov-append --cov-report=xml -x
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run property-based tests
        run: |
          pytest tests/property -v --hypothesis-show-statistics -x

      - name: Upload coverage reports
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
        if: matrix.python-version == '3.11'

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # These three are blocking: the tree is clean against all of them today
      # (tsc --noEmit, vitest and vite build all exit 0), so as `|| true` they
      # were a job that could not fail -- a TypeScript error or a broken build
      # would still have reported "Frontend Tests" green.
      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      # Stays advisory: the dependency tree currently carries 14 advisories
      # (1 critical, 7 high), so this cannot hold as a gate yet, and audit
      # results change whenever a new advisory is published rather than when
      # this repo changes. Left visible in the log as tracked debt.
      - name: npm audit (high+, non-blocking)
        run: npm audit --audit-level=high || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check
        run: safety check --full-report

      # -lll gates on HIGH severity only. The two HIGH findings (non-crypto MD5)
      # are fixed with usedforsecurity=False; the remaining medium/low findings
      # (eval, stdlib XML parsing, pickle, urlopen) are pre-existing lower-risk
      # smells left as tracked debt rather than blocking the build.
      - name: Run Bandit security linter
        run: bandit -r backend -lll -ii -x tests

  all-tests-pass:
    name: All Tests Pass
    # Must depend on every gating job, otherwise this reports success without
    # them: it previously needed only [lint, frontend-test], so the Python test
    # matrix and the security scan could fail while "All Tests Pass" went green.
    needs: [lint, test, frontend-test, security-scan]
    # ``test`` and ``security-scan`` are push-only, so they are *skipped* on
    # pull requests. Without always() this job would be skipped with them;
    # with it, the step below decides, treating skipped as acceptable and only
    # failure/cancelled as fatal.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FRONTEND: ${{ needs['frontend-test'].result }}
          SECURITY: ${{ needs['security-scan'].result }}
        run: |
          status=0
          for job in LINT TEST FRONTEND SECURITY; do
            result="${!job}"
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$job did not pass (result: $result)"; status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
