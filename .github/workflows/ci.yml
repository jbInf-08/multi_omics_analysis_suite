name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings
          # Pinned. These were unpinned, so a release of any of them could turn
          # this job red with no change to the repository -- and black's output
          # differs between majors, which is exactly how a formatted-on-23.11
          # file still failed a 26.x check here. Bump deliberately.
          pip install ruff==0.16.1 mypy==2.3.0 black==26.5.1

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with MyPy
        run: |
          pip install types-redis types-PyYAML
          mypy backend/app/api/v1/routes/omics.py \
            backend/app/api/graphql/schema.py \
            backend/app/api/graphql/context.py \
            backend/app/core/analysis_progress_bus.py \
            --ignore-missing-imports \
            --explicit-package-bases \
            --follow-imports=silent \
            --no-error-summary

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    # Deliberately not gated on the event. `push` only fires for main and
    # develop, so `if: github.event_name == 'push'` meant this job skipped on
    # every pull request from a branch -- the Python suite only ever ran after
    # a merge had already landed. all-tests-pass counts skipped as satisfied
    # (correctly, for the push-only security scan), so a pull request that
    # broke the backend reported green and could be merged. Nothing here needs
    # a secret or push context, so it runs for pull requests too.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_omics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      # rpy2 (a project dependency) refuses to build in API mode without R on
      # PATH/R_HOME, and its rinterface link step needs libtirpc.
      - name: Install system dependencies (R for rpy2)
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev libtirpc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=backend --cov-report=xml --cov-report=term-missing -x
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run bioinformatics tools API tests
        run: |
          pytest tests/integration/test_bioinformatics_tools_api.py \
            tests/integration/test_omics_analyze_api.py -v --no-cov
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run integration tests
        run: |
          pytest tests/integration -v --cov=backend --cov-append --cov-report=xml -x
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_omics
          REDIS_URL: redis://localhost:6379/0

      - name: Run property-based tests
        run: |
          pytest tests/property -v --hypothesis-show-statistics -x

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
        if: matrix.python-version == '3.11'

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # These four are blocking: the tree is clean against all of them today
      # (eslint, tsc --noEmit, vitest and vite build all exit 0), so as `|| true`
      # they were a job that could not fail -- a TypeScript error or a broken
      # build would still have reported "Frontend Tests" green.

      # The `lint` script previously named a binary the project did not depend
      # on, against a config file that did not exist, and no job ran it. It is
      # a real check now, so run it here where node and the deps are set up;
      # the `lint` job above only covers the Python tree.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # --passWithNoTests is gone: vitest is configured and there are real
      # tests, so an empty run is now a failure rather than a pass.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Blocking at critical, advisory above that. The two remaining high
      # advisories are both react-router's RSC-mode CSRF issue, which has no
      # fixed release (7.18.2 is current) and does not reach this app: it is a
      # client-only SPA on BrowserRouter with no RSC entry point, no framework
      # mode and no server actions. Audit results also change when a new
      # advisory is published rather than when this repo changes, so high is
      # left visible in the log instead of blocking.
      - name: npm audit (critical blocks, high advisory)
        run: |
          npm audit --audit-level=high || true
          npm audit --audit-level=critical

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned for the same reason as the linters above.
          pip install safety==3.8.1 bandit==1.9.4

      - name: Run Safety check
        run: safety check --full-report

      # -lll gates on HIGH severity only. The two HIGH findings (non-crypto MD5)
      # are fixed with usedforsecurity=False; the remaining medium/low findings
      # (eval, stdlib XML parsing, pickle, urlopen) are pre-existing lower-risk
      # smells left as tracked debt rather than blocking the build.
      - name: Run Bandit security linter
        run: bandit -r backend -lll -ii -x tests

  all-tests-pass:
    name: All Tests Pass
    # Must depend on every gating job, otherwise this reports success without
    # them: it previously needed only [lint, frontend-test], so the Python test
    # matrix and the security scan could fail while "All Tests Pass" went green.
    needs: [lint, test, frontend-test, security-scan]
    # ``security-scan`` is push-only, so it is skipped on pull requests and this
    # job would be skipped with it. always() lets the step below decide instead.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          # Jobs that must actually run and succeed. Accepting "skipped" here is
          # what let the Python matrix opt out of pull requests unnoticed, so a
          # skip is now a failure for these three.
          REQUIRED_LINT: ${{ needs.lint.result }}
          REQUIRED_TEST: ${{ needs.test.result }}
          REQUIRED_FRONTEND: ${{ needs['frontend-test'].result }}
          # May legitimately skip: push-only by design.
          OPTIONAL_SECURITY: ${{ needs['security-scan'].result }}
        run: |
          status=0
          for job in REQUIRED_LINT REQUIRED_TEST REQUIRED_FRONTEND; do
            result="${!job}"
            echo "$job: $result"
            case "$result" in
              success) ;;
              *) echo "::error::${job#REQUIRED_} must run and pass (result: $result)"; status=1 ;;
            esac
          done
          for job in OPTIONAL_SECURITY; do
            result="${!job}"
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::${job#OPTIONAL_} did not pass (result: $result)"; status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
