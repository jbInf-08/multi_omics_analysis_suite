apiVersion: apps/v1
kind: Deployment
metadata:
  name: moas-api
  namespace: multi-omics
  labels:
    app: moas-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moas-api
  template:
    metadata:
      labels:
        app: moas-api
        component: backend
    spec:
      containers:
        - name: api
          image: multi-omics-suite/api:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moas-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: moas-config
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: moas-secrets
                  key: secret-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: moas-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: moas-api
  namespace: multi-omics
spec:
  selector:
    app: moas-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moas-api-hpa
  namespace: multi-omics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moas-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
