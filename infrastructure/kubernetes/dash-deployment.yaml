apiVersion: apps/v1
kind: Deployment
metadata:
  name: moas-dash
  namespace: multi-omics
  labels:
    app: moas-dash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moas-dash
  template:
    metadata:
      labels:
        app: moas-dash
    spec:
      containers:
        - name: dash
          image: multi-omics/dashboards:latest
          ports:
            - containerPort: 8050
          env:
            - name: API_URL
              value: "http://moas-api:8000"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: moas-config
                  key: redis-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: moas-dash
  namespace: multi-omics
  labels:
    app: moas-dash
spec:
  selector:
    app: moas-dash
  ports:
    - port: 8050
      targetPort: 8050
  type: ClusterIP
