# Default values for multi-omics-suite

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# API Service
api:
  enabled: true
  replicaCount: 3
  image:
    repository: multi-omics-suite/api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8000

# Celery Workers
celery:
  enabled: true
  worker:
    replicaCount: 5
    concurrency: 4
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 4
        memory: 8Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
  beat:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Dashboard
dashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: multi-omics-suite/dashboard
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8050

# Frontend
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: multi-omics-suite/frontend
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80

# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: moas
    password: ""  # Set in secrets
    database: multi_omics
  primary:
    persistence:
      enabled: true
      size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

# Redis
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

# Kafka
kafka:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

# Neo4j
neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5.15.0"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 8Gi
  persistence:
    enabled: true
    size: 20Gi

# MinIO
minio:
  enabled: true
  mode: standalone
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    enabled: true
    size: 200Gi

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
  hosts:
    - host: api.multi-omics.local
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: dashboard.multi-omics.local
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls: []

# Monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Persistence
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteMany
  size: 100Gi

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
